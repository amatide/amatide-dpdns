<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amatide</title>
  <meta name="description" content="Personal page of amatide">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>~</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      line-height: 1.6;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 3rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .tagline {
      color: #888;
      font-size: 0.9rem;
    }
    nav {
      margin-bottom: 2rem;
    }
    nav a {
      color: #666;
      text-decoration: none;
      font-size: 0.85rem;
      margin-right: 1.5rem;
      transition: color 0.2s;
    }
    nav a:hover {
      color: #fff;
    }
    .content {
      margin-bottom: 2rem;
    }
    .content h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .content p {
      color: #999;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .links {
      list-style: none;
    }
    .links li {
      margin-bottom: 0.75rem;
    }
    .links a {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid #333;
      padding-bottom: 0.25rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .links a:hover {
      color: #fff;
      border-color: #666;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #222;
      color: #555;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>amatide</h1>
    <p class="tagline">personal page</p>
  </header>
  <nav>
    <a href="https://github.com/amatide">github</a>
  </nav>
  <main class="content">
    <h2>about</h2>
    <p>indonesian. working on various projects. mostly web and automation stuff.</p>
    <h2>links</h2>
    <ul class="links">
      <li><a href="https://github.com/amatide" target="_blank">github.com/amatide</a></li>
    </ul>
  </main>
  <footer>
    <p>&copy; 2026 amatide</p>
  </footer>
</body>
</html>
